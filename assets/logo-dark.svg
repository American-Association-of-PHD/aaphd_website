<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="AAPHD — American Association of Public Health Dentistry">
  <title>AAPHD</title>

  <!-- Top arc: pale blue-gray (visible on navy bg) -->
  <path d="M 100 42 Q 240 18 380 42" fill="none" stroke="#a3b1c4" stroke-width="3" stroke-linecap="round"/>

  <!-- AAPHD wordmark drawn as paths (white for dark backgrounds) -->
  <g fill="#FFFFFF" fill-rule="evenodd">
    <g transform="translate(60, 68)">
      <path d="M 0,100 L 28,0 L 35,0 L 18,100 Z M 35,0 L 42,0 L 70,100 L 52,100 Z M 19,67 L 51,67 L 51,77 L 19,77 Z"/>
    </g>
    <g transform="translate(136, 68)">
      <path d="M 0,100 L 28,0 L 35,0 L 18,100 Z M 35,0 L 42,0 L 70,100 L 52,100 Z M 19,67 L 51,67 L 51,77 L 19,77 Z"/>
    </g>
    <g transform="translate(212, 68)">
      <path d="M 0,0 L 32,0 A 24,28 0 0 1 32,56 L 18,56 L 18,100 L 0,100 Z M 18,12 L 28,12 A 14,16 0 0 1 28,44 L 18,44 Z"/>
    </g>
    <g transform="translate(274, 68)">
      <path d="M 0,0 L 18,0 L 18,40 L 52,40 L 52,0 L 70,0 L 70,100 L 52,100 L 52,58 L 18,58 L 18,100 L 0,100 Z"/>
    </g>
    <g transform="translate(350, 68)">
      <path d="M 0,0 L 35,0 A 35,50 0 0 1 35,100 L 0,100 Z M 18,12 L 30,12 A 18,38 0 0 1 30,88 L 18,88 Z"/>
    </g>
  </g>

  <!-- Bottom arc: coral -->
  <path d="M 100 185 Q 240 205 380 185" fill="none" stroke="#E85D3A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tagline -->
  <text x="240" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.5" fill="#a3b1c4" text-anchor="middle">AMERICAN ASSOCIATION OF</text>
  <text x="240" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.5" fill="#a3b1c4" text-anchor="middle">PUBLIC HEALTH DENTISTRY</text>
</svg>
